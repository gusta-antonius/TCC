spring.application.name=sistema-legado

# H2 em modo persistente (arquivo ./data/sistemalegado.mv.db, relativo ao diretorio de execucao).
# AUTO_SERVER=TRUE permite abrir o mesmo arquivo no console/cliente H2 com a aplicacao rodando.
spring.datasource.url=jdbc:h2:file:./data/sistemalegado;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# O schema vem do schema.sql (adaptacao dos scripts legado/scripts/*.sql); o Hibernate nao altera o banco.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# Console web do H2: http://localhost:8080/h2-console (somente acesso local)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false
